<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Classroom | TopMark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --blue: #0095f6; --blue-d: #0074cc; --blue-soft: #e8f4fd;
      --ink: #262626; --mute: #737373; --line: #e5e7eb;
      --bg: #f4f6f9; --card: #ffffff; --stage: #0f172a;
      --red: #ef4444; --red-soft: #fef2f2; --green: #16a34a; --amber: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ink); overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }

    .room { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* ───────── TOP BAR: class information ───────── */
    .room-header {
      flex-shrink: 0; background: var(--card); border-bottom: 1px solid var(--line);
      padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .class-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .class-icon {
      width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue);
      display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .class-text { min-width: 0; }
    .class-title { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .class-sub { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .tag { background: var(--blue-soft); color: var(--blue-d); font-weight: 700; padding: 2px 9px; border-radius: 20px; font-size: 11px; }
    .header-stats { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .stat-chip {
      display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--line);
      padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .stat-chip i { color: var(--blue); }
    .session-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

    /* ───────── MAIN AREA ───────── */
    .room-main { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 14px; }
    .stage-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

    /* Teacher stage (the "board / front of class") */
    .stage { position: relative; flex: 1; min-height: 0; background: var(--stage); border-radius: 16px; overflow: hidden; }
    #host-video-element { width: 100%; height: 100%; object-fit: contain; background: var(--stage); display: block; }

    .stage-placeholder {
      display: none; position: absolute; inset: 0; z-index: 5; background: #1e293b; color: #cbd5e1;
      flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-weight: 600;
    }
    .stage-placeholder .avatar-circle {
      width: 104px; height: 104px; border-radius: 50%; background: #334155; color: #93c5fd;
      display: flex; align-items: center; justify-content: center; font-size: 44px;
    }
    .waiting-overlay {
      display: none; position: absolute; inset: 0; z-index: 20; background: var(--stage); color: #e2e8f0;
      flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 20px;
    }
    .spinner { width: 44px; height: 44px; border: 3px solid #334155; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .teacher-tag {
      position: absolute; left: 14px; bottom: 14px; z-index: 10; background: rgba(15,23,42,0.78);
      color: #fff; padding: 7px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; pointer-events: none;
    }
    .teacher-tag small { background: var(--blue); padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .3px; }

    /* Student's own small preview */
    .self-preview {
      position: absolute; right: 14px; bottom: 14px; z-index: 12; width: 168px; aspect-ratio: 16 / 9;
      background: #1e293b; border: 2px solid #fff; border-radius: 12px; overflow: hidden; display: none;
    }
    .self-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .self-preview .self-avatar { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #94a3b8; }
    .self-label {
      position: absolute; left: 6px; bottom: 6px; background: rgba(15,23,42,.78); color: #fff;
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    }
    .self-mic {
      position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%;
      background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px;
    }
    .self-mic.on { background: var(--green); }

    /* Raised hands (teacher) */
    .hand-queue { position: absolute; top: 14px; left: 14px; z-index: 15; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 28px); }
    .hand-badge {
      background: #fff; color: var(--ink); border-left: 4px solid var(--amber); padding: 8px 10px 8px 12px;
      border-radius: 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
      animation: slideIn .25s ease;
    }
    .hand-badge i { color: var(--amber); }
    .hand-badge .dismiss-hand { margin-left: 6px; background: var(--bg); border: none; border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 700; color: var(--mute); }
    .hand-badge .dismiss-hand:hover { background: var(--line); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }

    /* Poll shown on the stage */
    .poll-overlay {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 18;
      width: min(400px, calc(100% - 28px)); background: #fff; color: var(--ink); border-radius: 14px;
      padding: 16px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    .poll-overlay.open { display: block; }
    .poll-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .poll-title-bar h4 { color: var(--blue-d); font-size: 13px; font-weight: 800; display: flex; gap: 6px; align-items: center; }
    .poll-title-bar button { background: none; border: none; color: var(--mute); font-size: 16px; }
    .poll-question { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .poll-option { position: relative; overflow: hidden; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .poll-option:hover { border-color: var(--blue); }
    .poll-option.voted { border-color: var(--blue); }
    .poll-option .opt-bar { position: absolute; inset: 0 auto 0 0; background: rgba(0,149,246,.16); transition: width .4s ease; }
    .poll-option .opt-label, .poll-option .opt-pct { position: relative; font-size: 13px; font-weight: 600; }
    .poll-option .opt-pct { float: right; color: var(--blue-d); font-weight: 700; font-size: 12px; }
    .poll-vote-count { font-size: 11px; color: var(--mute); margin-top: 4px; }

    /* ───────── CONTROLS BAR ───────── */
    .controls-bar { flex-shrink: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; overflow-x: auto; scrollbar-width: none; }
    .controls-bar::-webkit-scrollbar { display: none; }
    .controls-inner { display: flex; gap: 8px; margin: 0 auto; width: max-content; align-items: stretch; }
    .ctl {
      position: relative; min-width: 66px; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
      border-radius: 12px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; transition: background .15s, border-color .15s;
    }
    .ctl i { font-size: 18px; }
    .ctl:hover { background: #eceff3; }
    .ctl.on { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-d); }
    .ctl.off { background: var(--red-soft); border-color: #fecaca; color: #dc2626; }
    .ctl.end { background: var(--red); border-color: var(--red); color: #fff; }
    .ctl.end:hover { background: #dc2626; }
    .ctl.leave { color: #dc2626; }
    .ctl .dot { position: absolute; top: 6px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); display: none; }
    .ctl .dot.show { display: block; }
    .ctl-divider { width: 1px; background: var(--line); margin: 4px 4px; }
    .only-mobile { display: none; }

    /* ───────── SIDE PANEL ───────── */
    .side-panel { width: 340px; flex-shrink: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-head { display: none; padding: 14px 16px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-weight: 800; }
    .panel-head button { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--mute); }
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--line); }
    .sidebar-tab {
      flex: 1; background: none; border: none; border-bottom: 3px solid transparent; padding: 13px 4px 11px;
      font-size: 13px; font-weight: 700; color: var(--mute); display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sidebar-tab.active { color: var(--blue-d); border-bottom-color: var(--blue); }
    .tab-badge { background: var(--red); color: #fff; border-radius: 20px; font-size: 10px; min-width: 17px; height: 17px; padding: 0 5px; display: none; align-items: center; justify-content: center; }
    .tab-badge.show { display: inline-flex; }
    .tab-content { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .tab-content.active { display: flex; }

    .chat-messages, .qa-list, .roster-list { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .chat-message { background: var(--bg); padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; align-self: flex-start; max-width: 92%; word-wrap: break-word; }
    .chat-message .who { font-weight: 700; color: var(--ink); font-size: 12px; display: block; margin-bottom: 1px; }
    .chat-message.mine { background: var(--blue-soft); align-self: flex-end; }
    .chat-message.teacher .who { color: var(--blue-d); }
    .chat-message.teacher .who::after { content: 'Teacher'; margin-left: 6px; background: var(--blue); color: #fff; font-size: 9px; padding: 1px 6px; border-radius: 10px; font-weight: 700; }
    .chat-message.system { background: none; align-self: center; color: var(--mute); font-size: 12px; text-align: center; padding: 2px 8px; }

    .panel-input { padding: 12px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
    .panel-input input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid transparent; padding: 11px 14px; border-radius: 10px; font-size: 13px; font-family: inherit; color: var(--ink); outline: none; }
    .panel-input input:focus { border-color: var(--blue); background: #fff; }
    .panel-input button { background: var(--blue); border: none; padding: 0 16px; border-radius: 10px; font-weight: 700; color: #fff; font-size: 13px; }
    .panel-input button:hover { background: var(--blue-d); }

    .qa-item { background: var(--bg); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--amber); }
    .qa-item.answered { border-left-color: var(--green); opacity: .75; }
    .qa-asker { font-size: 12px; font-weight: 700; color: var(--mute); margin-bottom: 3px; }
    .qa-text { font-size: 13px; line-height: 1.45; }
    .qa-status { font-size: 11px; font-weight: 700; color: var(--green); margin-top: 6px; display: none; }
    .qa-item.answered .qa-status { display: block; }
    .qa-mark-btn { margin-top: 8px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: var(--green); }
    .qa-item.answered .qa-mark-btn { display: none; }
    .empty-note { color: var(--mute); font-size: 13px; text-align: center; padding: 34px 16px; line-height: 1.6; }
    .empty-note i { font-size: 28px; color: #cbd5e1; display: block; margin-bottom: 8px; }

    /* Class register / students list */
    .roster-list { gap: 4px; padding: 8px; }
    .roster-summary { padding: 10px 16px; font-size: 12px; color: var(--mute); font-weight: 600; border-bottom: 1px solid var(--line); }
    .roster-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
    .roster-row:hover { background: var(--bg); }
    .roster-row.hand { background: #fffbeb; }
    .thumb { position: relative; width: 38px; height: 38px; border-radius: 10px; background: var(--blue-soft); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .thumb.has-video video { display: block; }
    .thumb-initials { font-size: 12px; font-weight: 800; color: var(--blue-d); }
    .thumb.has-video .thumb-initials { display: none; }
    .r-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-hand { color: var(--amber); font-size: 14px; display: none; }
    .roster-row.hand .r-hand { display: inline-block; }
    .r-mic { width: 30px; height: 30px; border-radius: 8px; border: none; background: #dcfce7; color: var(--green); font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .r-mic.muted { background: var(--red-soft); color: #dc2626; }
    button.r-mic:hover { filter: brightness(.96); }

    .panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: none; }
    .panel-overlay.active { display: block; }

    /* Poll creator dialog */
    .poll-creator { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
    .poll-creator.open { display: flex; }
    .poll-creator-box { background: #fff; border-radius: 18px; padding: 24px; width: min(420px, 100%); }
    .poll-creator-box h3 { font-size: 17px; font-weight: 800; margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    .poll-creator-box h3 i { color: var(--blue); }
    .poll-creator-box input { width: 100%; background: var(--bg); border: 1px solid transparent; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-family: inherit; margin-bottom: 10px; outline: none; color: var(--ink); }
    .poll-creator-box input:focus { border-color: var(--blue); background: #fff; }
    .poll-opt-row { display: flex; gap: 6px; align-items: flex-start; }
    .poll-opt-row input { flex: 1; }
    .remove-opt { background: var(--bg); border: none; width: 38px; height: 38px; border-radius: 10px; color: var(--mute); flex-shrink: 0; }
    .add-option-btn { background: none; border: 1.5px dashed #cbd5e1; color: var(--mute); border-radius: 10px; padding: 9px; width: 100%; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .add-option-btn:hover { border-color: var(--blue); color: var(--blue); }
    .poll-creator-actions { display: flex; gap: 10px; margin-top: 14px; }
    .poll-creator-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; }
    .btn-launch-poll { background: var(--blue); color: #fff; flex: 2 !important; }
    .btn-cancel-poll { background: var(--bg); color: var(--ink); }

    /* ───────── RESPONSIVE ───────── */
    @media (max-width: 900px) {
      .room-header { padding: 8px 12px; }
      .class-icon { width: 34px; height: 34px; font-size: 15px; }
      .stat-chip.timer-chip { display: none; }
      .room-main { padding: 0; gap: 0; }
      .stage-col { gap: 0; }
      .stage { border-radius: 0; }
      .controls-bar { border-radius: 0; border-width: 1px 0 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); }
      .controls-inner { margin: 0; }
      .only-mobile { display: flex; }
      .self-preview { width: 110px; right: 10px; bottom: 10px; }
      .teacher-tag { left: 10px; bottom: 10px; }
      .side-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); border-radius: 0; z-index: 50; transform: translateX(100%); transition: transform .25s ease; }
      .side-panel.open { transform: translateX(0); }
      .panel-head { display: flex; }
    }
    @media (max-width: 480px) {
      .stat-chip { padding: 6px 9px; font-size: 12px; }
    }
  </style>
</head>
<body>
<div class="room">

  <!-- ═════════ CLASS INFORMATION BAR ═════════ -->
  <header class="room-header">
    <div class="class-info">
      <div class="class-icon"><i class="fa-solid fa-chalkboard"></i></div>
      <div class="class-text">
        <div class="class-title" id="session-title-display">Classroom</div>
        <div class="class-sub">
          <span class="tag" id="subject-class-tag" style="display:none;"></span>
          <span><i class="fa-solid fa-chalkboard-user"></i> <span id="teacher-name-header">Teacher</span></span>
        </div>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-chip timer-chip"><i class="fa-regular fa-clock"></i> <span id="class-timer">00:00</span></div>
      <div class="stat-chip"><span class="session-dot"></span> <span id="participant-count">1</span> in class</div>
    </div>
  </header>

  <div class="room-main">
    <!-- ═════════ TEACHER STAGE + CONTROLS ═════════ -->
    <section class="stage-col">
      <div class="stage" id="host-stage">
        <video id="host-video-element" autoplay playsinline></video>

        <div class="stage-placeholder" id="host-placeholder">
          <div class="avatar-circle"><i class="fa-solid fa-chalkboard-user"></i></div>
          <span id="host-placeholder-name">Teacher</span>
          <small style="font-weight:500;color:#94a3b8;">Camera is off</small>
        </div>

        <div class="waiting-overlay" id="waiting-overlay">
          <div class="spinner"></div>
          <span style="font-weight:600;">Waiting for the teacher to start the class…</span>
        </div>

        <div class="hand-queue" id="hand-queue"></div>

        <div class="teacher-tag"><i class="fa-solid fa-chalkboard-user"></i> <span id="host-display-name">Teacher</span> <small>TEACHER</small></div>

        <!-- student's own preview -->
        <div class="self-preview" id="self-preview">
          <video id="self-video" autoplay playsinline muted></video>
          <div class="self-avatar" id="self-avatar"><i class="fa-solid fa-user"></i></div>
          <span class="self-label">You</span>
          <span class="self-mic" id="self-mic-icon"><i class="fa-solid fa-microphone-slash"></i></span>
        </div>

        <!-- poll -->
        <div class="poll-overlay" id="poll-overlay">
          <div class="poll-title-bar"><h4><i class="fa-solid fa-chart-simple"></i> Class Poll</h4><button id="close-poll" aria-label="Close poll"><i class="fa-solid fa-xmark"></i></button></div>
          <div class="poll-question" id="poll-question-text"></div>
          <div id="poll-options-list"></div>
          <div class="poll-vote-count" id="poll-vote-count">0 votes</div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="controls-inner">
          <button class="ctl" id="toggle-audio"><i class="fa-solid fa-microphone"></i><span>Mic</span></button>
          <button class="ctl" id="toggle-video"><i class="fa-solid fa-video"></i><span>Camera</span></button>
          <button class="ctl" id="flip-camera" style="display:none;"><i class="fa-solid fa-rotate"></i><span>Flip</span></button>
          <button class="ctl" id="toggle-screen" style="display:none;"><i class="fa-solid fa-display"></i><span>Share screen</span></button>
          <button class="ctl" id="raise-hand-btn" style="display:none;"><i class="fa-solid fa-hand"></i><span>Raise hand</span></button>
          <button class="ctl" id="toggle-poll-creator" style="display:none;"><i class="fa-solid fa-chart-bar"></i><span>Poll</span></button>
          <button class="ctl" id="mute-all-btn" style="display:none;"><i class="fa-solid fa-microphone-slash"></i><span>Mute all</span></button>
          <button class="ctl only-mobile" id="toggle-panel"><i class="fa-regular fa-comments"></i><span>Class</span><span class="dot" id="panel-dot"></span></button>
          <span class="ctl-divider"></span>
          <button class="ctl leave" id="leave-room"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Leave</span></button>
          <button class="ctl end" id="end-class" style="display:none;"><i class="fa-solid fa-power-off"></i><span>End class</span></button>
        </div>
      </div>
    </section>

    <!-- ═════════ SIDE PANEL: chat / questions / students ═════════ -->
    <aside class="side-panel" id="side-panel">
      <div class="panel-head"><span>Class Panel</span><button id="close-panel" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tab-chat" data-tab="chat"><i class="fa-regular fa-comment"></i> Chat <span class="tab-badge" id="chat-dot"></span></button>
        <button class="sidebar-tab" id="tab-qa" data-tab="qa"><i class="fa-regular fa-circle-question"></i> Questions <span class="tab-badge" id="qa-dot"></span></button>
        <button class="sidebar-tab" id="tab-students" data-tab="students"><i class="fa-solid fa-users"></i> Students <span class="tab-badge" id="hand-dot"></span></button>
      </div>

      <div class="tab-content active" id="tab-content-chat">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="panel-input"><input type="text" id="chat-input" placeholder="Type a message to the class…" maxlength="500"><button id="send-chat">Send</button></div>
      </div>

      <div class="tab-content" id="tab-content-qa">
        <div class="qa-list" id="qa-list">
          <div class="empty-note" id="qa-empty"><i class="fa-regular fa-circle-question"></i>No questions yet.<br>Students can ask the teacher here.</div>
        </div>
        <div class="panel-input" id="qa-input-area"><input type="text" id="qa-input" placeholder="Ask the teacher a question…" maxlength="300"><button id="send-qa">Ask</button></div>
      </div>

      <div class="tab-content" id="tab-content-students">
        <div class="roster-summary" id="roster-summary">Students present: 0</div>
        <div class="roster-list" id="roster-list">
          <div class="empty-note" id="roster-empty"><i class="fa-solid fa-user-group"></i>No students have joined yet.</div>
        </div>
      </div>
    </aside>
  </div>

  <div class="panel-overlay" id="panel-overlay"></div>

  <!-- ═════════ POLL CREATOR (teacher) ═════════ -->
  <div class="poll-creator" id="poll-creator">
    <div class="poll-creator-box">
      <h3><i class="fa-solid fa-chart-bar"></i> Ask the class a question</h3>
      <input type="text" id="poll-q-input" placeholder="Poll question" maxlength="200">
      <div id="poll-options-builder">
        <div class="poll-opt-row"><input class="poll-opt-input" placeholder="Option A" maxlength="100"><button class="remove-opt" onclick="removePollOption(this)">✕</button></div>
        <div class="poll-opt-row"><input class="poll-opt-input" placeholder="Option B" maxlength="100"><button class="remove-opt" onclick="removePollOption(this)">✕</button></div>
      </div>
      <button class="add-option-btn" id="add-option-btn"><i class="fa-solid fa-plus"></i> Add option</button>
      <div class="poll-creator-actions"><button class="btn-cancel-poll" id="cancel-poll-btn">Cancel</button><button class="btn-launch-poll" id="launch-poll-btn">Start poll</button></div>
    </div>
  </div>
</div>

<script>
  // ── Django template variables ─────────────────────────────────
  const roomName     = '{{ room_name|escapejs }}';
  const userName     = '{{ user.username|escapejs }}';
  const userId       = Number('{{ user.id }}');
  const isHost       = Boolean({{ is_creator|yesno:"true,false" }});
  const hostId       = Number('{{ host_id }}');
  const sessionTitle = '{{ session.title|escapejs }}';
  const sessionSubject = '{{ session.subject_name|escapejs }}';
  const sessionClass   = '{{ session.class_level|escapejs }}';
  const hostUsername = '{{ session.created_by.username|escapejs }}';
  const hostFullName = '{{ session.created_by.get_full_name|escapejs }}';
  const LIST_URL     = "{% url 'live_room_list' %}";
  const END_URL      = "{% url 'end_live_room' room_name=room_name %}";

  const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }], iceCandidatePoolSize: 10 };
  const teacherLabel = hostFullName || hostUsername || 'Teacher';

  // ── State ─────────────────────────────────────────────────────
  let localStream = null, screenStream = null, socket = null, leaving = false;
  const peerConnections = {};
  const present  = new Map();   // everyone else in the room: userId -> name
  const students = new Map();   // students on the register: userId -> {name, mic, hand}
  let isVideoEnabled = true;
  let isAudioEnabled = isHost;  // students join muted, like a real class; the teacher joins live
  let isScreenSharing = false, currentFacingMode = 'user', handRaised = false;
  let activePoll = null, activePollOptions = [], pollVotes = {}, myVote = null;
  let activeSidebarTab = 'chat';
  const joinedAt = Date.now();

  const $ = (id) => document.getElementById(id);
  const hostVideoEl = $('host-video-element');

  // ── Helpers ───────────────────────────────────────────────────
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }
  function initials(name) { return (name || '?').trim().slice(0, 2).toUpperCase(); }
  function send(obj) { if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj)); }

  // ── Header / info ─────────────────────────────────────────────
  $('session-title-display').textContent = sessionTitle || 'Classroom';
  $('teacher-name-header').textContent = teacherLabel;
  $('host-display-name').textContent = teacherLabel;
  $('host-placeholder-name').textContent = teacherLabel;
  if (sessionSubject || sessionClass) {
    const tag = $('subject-class-tag');
    tag.textContent = [sessionSubject, sessionClass].filter(Boolean).join(' · ');
    tag.style.display = 'inline-block';
  }
  document.title = (sessionTitle || 'Classroom') + ' | TopMark';

  setInterval(() => {
    const s = Math.floor((Date.now() - joinedAt) / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    $('class-timer').textContent = (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(sec);
  }, 1000);

  function updateAttendance() { $('participant-count').textContent = present.size + 1; }

  // ── Teacher stage ─────────────────────────────────────────────
  function setHostVideo(stream) {
    hostVideoEl.srcObject = stream;
    hostVideoEl.style.display = 'block';
    $('waiting-overlay').style.display = 'none';
    if (isHost) {
      hostVideoEl.muted = true;
    } else {
      hostVideoEl.muted = false;
      hostVideoEl.volume = 1.0;
    }
    hostVideoEl.play().catch(() => {
      // Autoplay with sound blocked: start muted, unmute on the first tap / key press.
      hostVideoEl.muted = true;
      hostVideoEl.play().catch(() => {});
      const unlock = () => { hostVideoEl.muted = false; hostVideoEl.play().catch(() => {}); };
      ['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { once: true, passive: true }));
    });
  }
  function showWaitingOverlay() { hostVideoEl.style.display = 'none'; $('host-placeholder').style.display = 'none'; $('waiting-overlay').style.display = 'flex'; }
  function setHostCameraOff(off) { $('host-placeholder').style.display = off ? 'flex' : 'none'; }

  function showSelfPreview() {
    if (isHost) return;
    $('self-preview').style.display = 'block';
    if (localStream && localStream.getVideoTracks().length) {
      $('self-video').srcObject = localStream;
      $('self-avatar').style.display = isVideoEnabled ? 'none' : 'flex';
      $('self-video').style.display = isVideoEnabled ? 'block' : 'none';
    }
    updateSelfMicIcon();
  }
  function updateSelfMicIcon() {
    const el = $('self-mic-icon');
    el.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
    el.classList.toggle('on', isAudioEnabled);
  }

  // ── Control button states ─────────────────────────────────────
  function refreshControls() {
    const a = $('toggle-audio'), v = $('toggle-video');
    a.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-microphone"></i><span>Mic</span>' : '<i class="fa-solid fa-microphone-slash"></i><span>Unmute</span>';
    a.classList.toggle('off', !isAudioEnabled);
    v.innerHTML = isVideoEnabled ? '<i class="fa-solid fa-video"></i><span>Camera</span>' : '<i class="fa-solid fa-video-slash"></i><span>Camera off</span>';
    v.classList.toggle('off', !isVideoEnabled);
    updateSelfMicIcon();
  }

  // ── Student register (class list) ─────────────────────────────
  function updateRosterSummary() {
    const total = students.size;
    let hands = 0, speaking = 0;
    students.forEach(s => { if (s.hand) hands++; if (s.mic) speaking++; });
    $('roster-summary').textContent = 'Students present: ' + total + (isHost && total ? ' · Mic on: ' + speaking : '');
    $('roster-empty').style.display = total ? 'none' : 'block';
    const badge = $('hand-dot');
    badge.textContent = hands;
    badge.classList.toggle('show', hands > 0 && isHost);
    $('panel-dot').classList.toggle('show', hands > 0 && isHost);
  }

  function addStudent(uid, name) {
    uid = Number(uid);
    if (students.has(uid)) return;
    students.set(uid, { name, mic: false, hand: false });
    const row = document.createElement('div');
    row.className = 'roster-row';
    row.id = 'student-row-' + uid;
    row.innerHTML =
      '<div class="thumb" id="thumb-' + uid + '">' +
        (isHost ? '<video id="video-element-' + uid + '" autoplay playsinline></video>' : '') +
        '<span class="thumb-initials">' + escapeHtml(initials(name)) + '</span>' +
      '</div>' +
      '<div class="r-name">' + escapeHtml(name) + '</div>' +
      '<i class="fa-solid fa-hand r-hand" title="Hand raised"></i>';
    const mic = document.createElement(isHost ? 'button' : 'span');
    mic.className = 'r-mic muted';
    mic.id = 'r-mic-' + uid;
    mic.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
    if (isHost) {
      mic.title = 'Mute / unmute ' + name;
      mic.onclick = () => teacherToggleStudentMic(uid);
    }
    row.appendChild(mic);
    $('roster-list').appendChild(row);
    updateRosterSummary();
  }
  function removeStudent(uid) {
    uid = Number(uid);
    students.delete(uid);
    $('student-row-' + uid)?.remove();
    if (peerConnections[uid]) { peerConnections[uid].close(); delete peerConnections[uid]; }
    dismissHand(uid);
    updateRosterSummary();
  }
  function setStudentMic(uid, enabled) {
    uid = Number(uid);
    const s = students.get(uid);
    if (!s) return;
    s.mic = !!enabled;
    const el = $('r-mic-' + uid);
    if (el) {
      el.classList.toggle('muted', !enabled);
      el.innerHTML = enabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
    }
    updateRosterSummary();
  }
  function setStudentVideo(uid, enabled) {
    const thumb = $('thumb-' + Number(uid));
    if (!thumb) return;
    const vid = thumb.querySelector('video');
    thumb.classList.toggle('has-video', !!(enabled && vid && vid.srcObject));
  }
  function setStudentHand(uid, raised, name) {
    uid = Number(uid);
    const s = students.get(uid);
    if (!s) return;
    s.hand = !!raised;
    const row = $('student-row-' + uid);
    if (row) {
      row.classList.toggle('hand', !!raised);
      if (raised) $('roster-list').prepend(row);   // raised hands go to the top of the register
    }
    if (isHost) { raised ? showHandBadge(name || s.name, uid) : $('hand-badge-' + uid)?.remove(); }
    updateRosterSummary();
  }
  function showHandBadge(username, uid) {
    if ($('hand-badge-' + uid)) return;
    const badge = document.createElement('div');
    badge.className = 'hand-badge';
    badge.id = 'hand-badge-' + uid;
    badge.innerHTML = '<i class="fa-solid fa-hand"></i><span><strong>' + escapeHtml(username) + '</strong> has a question</span><button class="dismiss-hand" onclick="dismissHand(' + uid + ')">Done</button>';
    $('hand-queue').appendChild(badge);
  }
  function dismissHand(uid) {
    uid = Number(uid);
    $('hand-badge-' + uid)?.remove();
    const s = students.get(uid);
    if (s && s.hand) { s.hand = false; $('student-row-' + uid)?.classList.remove('hand'); updateRosterSummary(); }
  }
  function teacherToggleStudentMic(uid) {
    uid = Number(uid);
    const s = students.get(uid);
    if (!s) return;
    const enabled = !s.mic;
    send({ type: 'mic_control', target_user_id: uid, enabled });
    setStudentMic(uid, enabled);
  }
  function muteAllStudents() {
    students.forEach((s, uid) => {
      if (s.mic) { send({ type: 'mic_control', target_user_id: uid, enabled: false }); setStudentMic(uid, false); }
    });
    addChatMessage('System', 'All students have been muted.', 'system');
  }

  function routeRemoteStream(remoteUserId, stream) {
    if (Number(remoteUserId) === hostId) { setHostVideo(stream); return; }
    const vid = $('video-element-' + remoteUserId);
    if (vid && stream) {
      vid.srcObject = stream;
      vid.play().catch(() => {});
      $('thumb-' + remoteUserId)?.classList.add('has-video');
    }
  }

  // ── WebRTC ────────────────────────────────────────────────────
  function buildPeer(remoteUserId) {
    if (peerConnections[remoteUserId]) { try { peerConnections[remoteUserId].close(); } catch (e) {} }
    const pc = new RTCPeerConnection(configuration);
    peerConnections[remoteUserId] = pc;
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = e => { if (e.candidate) send({ type: 'ice_candidate', candidate: e.candidate, target_user_id: remoteUserId }); };
    pc.ontrack = e => { if (e.streams && e.streams[0]) routeRemoteStream(remoteUserId, e.streams[0]); };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' && isHost && peerConnections[remoteUserId] === pc) {
        pc.close(); delete peerConnections[remoteUserId];
        if (students.has(Number(remoteUserId))) setTimeout(() => ensureOffer(remoteUserId), 1500);
      }
    };
    return pc;
  }
  async function createOffer(remoteUserId) {
    const pc = buildPeer(remoteUserId);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    send({ type: 'offer', offer, target_user_id: remoteUserId });
  }
  async function handleOffer(data) {
    if (data.target_user_id && data.target_user_id != userId) return;
    if (!isHost && data.user_id == hostId) { present.set(hostId, data.user); updateAttendance(); }
    const pc = buildPeer(data.user_id);
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({ type: 'answer', answer, target_user_id: data.user_id });
  }
  // The server relays offer/answer/ICE to the whole room, so ignore anything addressed to someone else.
  async function handleAnswer(data) {
    if (data.target_user_id && data.target_user_id != userId) return;
    const pc = peerConnections[data.user_id];
    try { if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer)); } catch (e) { console.warn('answer failed', e); }
  }
  async function handleIceCandidate(data) {
    if (data.target_user_id && data.target_user_id != userId) return;
    const pc = peerConnections[data.user_id];
    try { if (pc && data.candidate) await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) { /* late candidate for a closed connection */ }
  }
  // Teacher side: open a connection to a student only once.
  function ensureOffer(uid) {
    uid = Number(uid);
    if (peerConnections[uid]) return;
    createOffer(uid).catch(e => console.warn('offer failed', e));
  }
  function replaceVideoTrack(track) {
    Object.values(peerConnections).forEach(pc => {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(track).catch(() => {});
    });
  }

  // ── Local camera / mic ────────────────────────────────────────
  async function initLocalStream() {
    const audio = { echoCancellation: true, noiseSuppression: true };
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio });
    } catch (err) {
      try {                                            // no camera? join with the microphone only
        localStream = await navigator.mediaDevices.getUserMedia({ audio });
        isVideoEnabled = false;
        addChatMessage('System', 'Camera not available. You joined with audio only.', 'system');
      } catch (err2) {
        addChatMessage('System', 'Cannot access camera/microphone: ' + err2.message, 'system');
      }
    }
    if (localStream) {
      localStream.getAudioTracks().forEach(t => t.enabled = isAudioEnabled);
      localStream.getVideoTracks().forEach(t => t.enabled = isVideoEnabled);
    }
    if (isHost) {
      if (localStream) setHostVideo(localStream);
      setHostCameraOff(!isVideoEnabled);
    } else {
      showSelfPreview();
      showWaitingOverlay();
    }
    refreshControls();
  }
  function toggleVideo() {
    if (!localStream || !localStream.getVideoTracks().length) return;
    isVideoEnabled = !isVideoEnabled;
    localStream.getVideoTracks().forEach(t => t.enabled = isVideoEnabled);
    if (isHost && !isScreenSharing) setHostCameraOff(!isVideoEnabled);
    if (!isHost) showSelfPreview();
    refreshControls();
    send({ type: 'video_toggle', enabled: isVideoEnabled });
  }
  function toggleAudio(forced) {
    isAudioEnabled = (typeof forced === 'boolean') ? forced : !isAudioEnabled;
    localStream?.getAudioTracks().forEach(t => t.enabled = isAudioEnabled);
    refreshControls();
    send({ type: 'audio_toggle', enabled: isAudioEnabled });
  }
  async function flipCamera() {
    if (!localStream) return;
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
      const track = s.getVideoTracks()[0];
      track.enabled = isVideoEnabled;
      const old = localStream.getVideoTracks()[0];
      if (old) { localStream.removeTrack(old); old.stop(); }
      localStream.addTrack(track);
      if (!isScreenSharing) replaceVideoTrack(track);
      if (isHost) { if (!isScreenSharing) setHostVideo(localStream); } else { $('self-video').srcObject = localStream; }
    } catch (e) {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      addChatMessage('System', 'Could not switch camera.', 'system');
    }
  }
  async function toggleScreenShare() {
    if (!isHost) return;
    if (isScreenSharing) { stopScreenShare(); return; }
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    } catch (e) { return; }
    const track = screenStream.getVideoTracks()[0];
    track.onended = stopScreenShare;
    replaceVideoTrack(track);
    hostVideoEl.srcObject = screenStream;
    setHostCameraOff(false);
    isScreenSharing = true;
    send({ type: 'screen_share', enabled: true });
    $('toggle-screen').classList.add('on');
    $('toggle-screen').querySelector('span').textContent = 'Stop sharing';
  }
  function stopScreenShare() {
    if (!isScreenSharing) return;
    screenStream?.getTracks().forEach(t => t.stop());
    screenStream = null;
    isScreenSharing = false;
    send({ type: 'screen_share', enabled: false });
    const cam = localStream && localStream.getVideoTracks()[0];
    if (cam) replaceVideoTrack(cam);
    if (localStream) hostVideoEl.srcObject = localStream;
    setHostCameraOff(!isVideoEnabled);
    $('toggle-screen').classList.remove('on');
    $('toggle-screen').querySelector('span').textContent = 'Share screen';
  }

  // ── Hand, chat, questions ─────────────────────────────────────
  function toggleHand() {
    handRaised = !handRaised;
    const b = $('raise-hand-btn');
    b.classList.toggle('on', handRaised);
    b.querySelector('span').textContent = handRaised ? 'Lower hand' : 'Raise hand';
    send({ type: 'raise_hand', raised: handRaised });
  }
  function addChatMessage(sender, msg, kind) {
    const box = $('chat-messages');
    const div = document.createElement('div');
    if (kind === 'system') {
      div.className = 'chat-message system';
      div.textContent = msg;
    } else {
      const mine = sender === userName;
      const fromTeacher = sender === hostUsername;
      div.className = 'chat-message' + (mine ? ' mine' : '') + (fromTeacher ? ' teacher' : '');
      div.innerHTML = '<span class="who">' + escapeHtml(mine ? 'You' : sender) + '</span>' + escapeHtml(msg);
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  function addQuestionToPanel(qid, username, text) {
    if ($('qa-' + qid)) return;
    $('qa-empty').style.display = 'none';
    const item = document.createElement('div');
    item.className = 'qa-item';
    item.id = 'qa-' + qid;
    item.innerHTML =
      '<div class="qa-asker">' + escapeHtml(username) + ' asks:</div>' +
      '<div class="qa-text">' + escapeHtml(text) + '</div>' +
      '<div class="qa-status"><i class="fa-solid fa-circle-check"></i> Answered</div>' +
      (isHost ? '<button class="qa-mark-btn" onclick="markAnswered(\'' + qid + '\')"><i class="fa-solid fa-check"></i> Mark answered</button>' : '');
    const list = $('qa-list');
    list.appendChild(item);
    list.scrollTop = list.scrollHeight;
    if (activeSidebarTab !== 'qa') $('qa-dot').classList.add('show');
    updateTabDots();
  }
  function markAnswered(qid) { send({ type: 'question_answered', question_id: qid }); $('qa-' + qid)?.classList.add('answered'); }

  // Small red dot on the tabs (empty dots, count shown only for raised hands)
  function updateTabDots() {
    const unread = $('chat-dot').classList.contains('show') || $('qa-dot').classList.contains('show');
    if (unread && window.matchMedia('(max-width: 900px)').matches) $('panel-dot').classList.add('show');
  }

  // ── Poll ──────────────────────────────────────────────────────
  function showPoll(pollId, question, options) {
    activePoll = pollId; activePollOptions = options; pollVotes = {}; myVote = null;
    options.forEach((_, i) => pollVotes[i] = 0);
    $('poll-question-text').textContent = question;
    renderPollOptions();
    $('poll-overlay').classList.add('open');
  }
  function renderPollOptions() {
    const box = $('poll-options-list');
    box.innerHTML = '';
    const total = Object.values(pollVotes).reduce((a, b) => a + b, 0);
    activePollOptions.forEach((opt, i) => {
      const votes = pollVotes[i] || 0;
      const pct = total > 0 ? Math.round((votes / total) * 100) : 0;
      const div = document.createElement('div');
      div.className = 'poll-option' + (myVote === i ? ' voted' : '');
      div.innerHTML = '<div class="opt-bar" style="width:' + pct + '%"></div><span class="opt-label">' + escapeHtml(opt) + '</span><span class="opt-pct">' + pct + '%</span>';
      if (myVote === null && !isHost) div.addEventListener('click', () => castVote(i));
      box.appendChild(div);
    });
    $('poll-vote-count').textContent = total + ' vote' + (total !== 1 ? 's' : '');
  }
  function castVote(idx) {
    if (myVote !== null || !activePoll) return;
    myVote = idx;
    send({ type: 'poll_vote', poll_id: activePoll, option_index: idx });
    pollVotes[idx] = (pollVotes[idx] || 0) + 1;
    renderPollOptions();
  }

  // ── WebSocket ─────────────────────────────────────────────────
  function initWebSocket() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(protocol + '//' + location.host + '/ws/live/' + roomName + '/');

    socket.onopen = () => { send({ type: 'audio_toggle', enabled: isAudioEnabled }); };

    socket.onmessage = (e) => {
      const data = JSON.parse(e.data);
      switch (data.type) {
        case 'user_joined': {
          if (data.user_id == userId) break;
          present.set(Number(data.user_id), data.user);
          if (data.user_id == hostId) {
            if (!isHost) {
              // Teacher (re)joined: drop the old link and wait for a fresh offer. Announce ourselves so
              // the teacher finds us, because the server does not list who is already in the room.
              if (peerConnections[hostId]) { peerConnections[hostId].close(); delete peerConnections[hostId]; }
              showWaitingOverlay();
              send({ type: 'audio_toggle', enabled: isAudioEnabled });
            }
          } else {
            addStudent(data.user_id, data.user);
            if (isHost) ensureOffer(data.user_id);
          }
          addChatMessage('System', data.user + ' joined the class', 'system');
          updateAttendance();
          break;
        }
        case 'user_left': {
          present.delete(Number(data.user_id));
          removeStudent(data.user_id);
          addChatMessage('System', data.user + ' left the class', 'system');
          updateAttendance();
          if (!isHost && data.user_id == hostId) {
            if (peerConnections[hostId]) { peerConnections[hostId].close(); delete peerConnections[hostId]; }
            showWaitingOverlay();
          }
          break;
        }
        case 'offer': handleOffer(data); break;
        case 'answer': handleAnswer(data); break;
        case 'ice_candidate': handleIceCandidate(data); break;
        case 'audio_toggle': {
          if (data.user_id == userId) break;
          // A mic update from someone we have not met yet means they were already in the room before us.
          if (data.user_id != hostId && !students.has(Number(data.user_id))) {
            present.set(Number(data.user_id), data.user);
            addStudent(data.user_id, data.user);
            updateAttendance();
          }
          if (isHost && data.user_id != hostId) ensureOffer(data.user_id);
          setStudentMic(data.user_id, data.enabled);
          break;
        }
        case 'screen_share':
          if (!isHost && data.user_id == hostId) {
            if (data.enabled) setHostCameraOff(false);
            addChatMessage('System', teacherLabel + (data.enabled ? ' is sharing their screen.' : ' stopped sharing their screen.'), 'system');
          }
          break;
        case 'video_toggle':
          if (data.user_id == hostId) { if (!isHost) setHostCameraOff(!data.enabled); }
          else setStudentVideo(data.user_id, data.enabled);
          break;
        case 'chat_message':
          addChatMessage(data.user, data.message);
          if (activeSidebarTab !== 'chat' && data.user !== userName) { $('chat-dot').classList.add('show'); updateTabDots(); }
          break;
        case 'raise_hand':
          if (data.user_id != userId) setStudentHand(data.user_id, data.raised, data.user);
          break;
        case 'question_ask': addQuestionToPanel(data.question_id, data.user, data.question); break;
        case 'question_answered': $('qa-' + data.question_id)?.classList.add('answered'); break;
        case 'poll_create':
          showPoll(data.poll_id, data.question, data.options);
          addChatMessage('System', data.user + ' started a poll: ' + data.question, 'system');
          break;
        case 'poll_vote':
          if (activePoll === data.poll_id && data.user_id != userId) {
            pollVotes[data.option_index] = (pollVotes[data.option_index] || 0) + 1;
            renderPollOptions();
          }
          break;
        case 'poll_end':
          if (!isHost && activePoll === data.poll_id) { $('poll-overlay').classList.remove('open'); activePoll = null; }
          break;
        case 'class_ended':
          if (!isHost) showClassClosed('The teacher has ended the class.');
          break;
        case 'rejected':
          showClassClosed(data.reason || 'You cannot join this class.');
          break;
        case 'mic_control':
          if (data.target_user_id == userId && !isHost) {
            toggleAudio(data.enabled);
            addChatMessage('System', data.enabled ? 'The teacher unmuted your microphone.' : 'The teacher muted your microphone.', 'system');
          }
          break;
      }
    };
    socket.onclose = () => {
      if (leaving) return;
      addChatMessage('System', 'Connection lost. Reconnecting…', 'system');
      setTimeout(() => { if (!leaving) initWebSocket(); }, 3000);
    };
  }

  // ── Leave / end ───────────────────────────────────────────────
  function cleanup() {
    leaving = true;
    localStream?.getTracks().forEach(t => t.stop());
    screenStream?.getTracks().forEach(t => t.stop());
    Object.values(peerConnections).forEach(pc => pc.close());
    try { socket && socket.close(); } catch (e) {}
  }
  function leaveRoom() { cleanup(); window.location.href = LIST_URL; }
  function showClassClosed(message) {
    cleanup();
    const ov = $('waiting-overlay');
    ov.innerHTML = '<i class="fa-solid fa-door-closed" style="font-size:42px;color:#94a3b8;"></i>' +
      '<span style="font-weight:700;font-size:16px;">' + escapeHtml(message) + '</span>' +
      '<a href="' + LIST_URL + '" style="background:#0095f6;color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;text-decoration:none;font-size:13px;">Back to live classes</a>';
    $('host-placeholder').style.display = 'none';
    ov.style.display = 'flex';
    setTimeout(() => { window.location.href = LIST_URL; }, 5000);
  }
  function endClass() {
    if (!confirm('End this class for everyone?')) return;
    send({ type: 'end_class' });              // tells every student, and closes the class on the server
    leaving = true;
    setTimeout(() => { cleanup(); window.location.href = END_URL; }, 500);
  }

  // ── Side panel tabs ───────────────────────────────────────────
  function switchTab(tab) {
    activeSidebarTab = tab;
    ['chat', 'qa', 'students'].forEach(t => {
      $('tab-' + t).classList.toggle('active', t === tab);
      $('tab-content-' + t).classList.toggle('active', t === tab);
    });
    if (tab === 'chat') $('chat-dot').classList.remove('show');
    if (tab === 'qa') $('qa-dot').classList.remove('show');
  }
  function openPanel() { $('side-panel').classList.add('open'); $('panel-overlay').classList.add('active'); $('panel-dot').classList.remove('show'); }
  function closePanel() { $('side-panel').classList.remove('open'); $('panel-overlay').classList.remove('active'); }

  // ── Boot ──────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    addChatMessage('System', 'Welcome to ' + (sessionTitle || 'the class') + '.', 'system');

    // Role-based layout
    const isMobileDevice = /Mobi|Android/i.test(navigator.userAgent);
    if (isMobileDevice) $('flip-camera').style.display = 'flex';
    if (isHost) {
      $('toggle-screen').style.display = 'flex';
      $('toggle-poll-creator').style.display = 'flex';
      $('mute-all-btn').style.display = 'flex';
      $('end-class').style.display = 'flex';
      $('qa-input-area').style.display = 'none';
      $('qa-empty').innerHTML = '<i class="fa-regular fa-circle-question"></i>No questions yet.<br>Students\' questions will appear here.';
    } else {
      $('raise-hand-btn').style.display = 'flex';
      addChatMessage('System', 'You joined with your microphone off. Tap Mic to speak, or Raise hand to ask a question.', 'system');
    }

    await initLocalStream();
    initWebSocket();

    // Controls
    $('toggle-video').onclick = toggleVideo;
    $('toggle-audio').onclick = () => toggleAudio();
    $('flip-camera').onclick = flipCamera;
    $('toggle-screen').onclick = toggleScreenShare;
    $('raise-hand-btn').onclick = toggleHand;
    $('leave-room').onclick = leaveRoom;
    $('end-class').onclick = endClass;
    $('mute-all-btn').onclick = muteAllStudents;

    // Panel
    document.querySelectorAll('.sidebar-tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
    $('toggle-panel').onclick = openPanel;
    $('close-panel').onclick = closePanel;
    $('panel-overlay').onclick = closePanel;

    // Chat & questions
    const sendChat = () => { const i = $('chat-input'); if (i.value.trim()) { send({ type: 'chat_message', message: i.value.trim() }); i.value = ''; } };
    $('send-chat').onclick = sendChat;
    $('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
    const sendQa = () => {
      const i = $('qa-input');
      if (!i.value.trim()) return;
      const qid = 'q_' + Date.now() + '_' + userId;
      addQuestionToPanel(qid, userName, i.value.trim());
      send({ type: 'question_ask', question: i.value.trim(), question_id: qid });
      i.value = '';
    };
    $('send-qa').onclick = sendQa;
    $('qa-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendQa(); });

    // Poll (teacher)
    $('toggle-poll-creator').onclick = () => $('poll-creator').classList.add('open');
    $('cancel-poll-btn').onclick = () => $('poll-creator').classList.remove('open');
    $('add-option-btn').onclick = () => {
      const row = document.createElement('div');
      row.className = 'poll-opt-row';
      row.innerHTML = '<input class="poll-opt-input" placeholder="Option" maxlength="100"><button class="remove-opt" onclick="removePollOption(this)">✕</button>';
      $('poll-options-builder').appendChild(row);
    };
    $('launch-poll-btn').onclick = () => {
      const q = $('poll-q-input').value.trim();
      const opts = Array.from(document.querySelectorAll('.poll-opt-input')).map(i => i.value.trim()).filter(Boolean);
      if (q && opts.length >= 2) {
        send({ type: 'poll_create', poll_id: 'poll_' + Date.now(), question: q, options: opts });
        $('poll-creator').classList.remove('open');
        $('poll-q-input').value = '';
        document.querySelectorAll('.poll-opt-input').forEach(i => i.value = '');
      } else {
        addChatMessage('System', 'Please enter a question and at least 2 options.', 'system');
      }
    };
    $('close-poll').onclick = () => {
      $('poll-overlay').classList.remove('open');
      if (isHost && activePoll) send({ type: 'poll_end', poll_id: activePoll });
      activePoll = null;
    };
  });

  window.addEventListener('beforeunload', () => { leaving = true; });
  window.dismissHand = dismissHand;
  window.markAnswered = markAnswered;
  window.removePollOption = function (btn) {
    if ($('poll-options-builder').children.length > 2) btn.parentElement.remove();
  };
</script>
</body>
</html>
