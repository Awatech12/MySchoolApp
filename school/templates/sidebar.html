<style>
  /* ═══════════════════════════════════════════
     DESKTOP SIDEBAR  (hidden on mobile)
  ═══════════════════════════════════════════ */
  .ac-sidebar {
    display: none; /* mobile: hidden */
  }

  @media (min-width: 768px) {
    /* Sidebar wrapper */
    .ac-sidebar {
      display: flex;
      flex-direction: column;
      position: fixed;
      top: var(--ac-header-h, 64px); left: 0;
      width: 270px;
      height: calc(100vh - var(--ac-header-h, 64px));
      background: var(--ac-white, #fff);
      padding: 20px 14px 20px;
      z-index: 900;
      overflow-y: auto;
      gap: 4px;
      box-sizing: border-box;
    }

    /* Nav items */
    .ac-sidebar-item {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--ac-text-light, #737373);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--ac-font, inherit);
      transition: background 0.15s, color 0.15s;
    }
    .ac-sidebar-item svg {
      width: 22px; height: 22px;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
      transition: stroke 0.15s;
    }
    .ac-sidebar-item:hover,
    .ac-sidebar-item.active {
      background: var(--ac-primary-lt, #e8f4fd);
      color: var(--ac-primary, #0095f6);
    }
    .ac-sidebar-item.active { font-weight: 700; }

    /* Profile avatar in sidebar */
    .ac-sidebar-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Create / "+" button in sidebar */
    .ac-sidebar-create {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin: 8px 0;
      padding: 11px 14px;
      background: var(--ac-primary, #0095f6);
      color: #fff;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--ac-font, inherit);
      transition: background 0.15s, transform 0.12s;
    }
    .ac-sidebar-create svg {
      width: 20px; height: 20px;
      stroke: #fff; fill: none;
      flex-shrink: 0;
    }
    .ac-sidebar-create:hover {
      background: var(--ac-primary-dk, #0074cc);
      transform: translateY(-1px);
    }

    /* Spacer pushes logout to bottom */
    .ac-sidebar-spacer {
      flex: 1;
    }

    /* Push main content right so it doesn't hide behind sidebar */
    body {
      padding-left: 220px !important;
    }
  }
</style>

<aside class="ac-sidebar">

  <!-- Home -->
  <a href="{% url 'home' %}"
     class="ac-sidebar-item{% if request.path == '/' %} active{% endif %}"
     title="Home">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12l9-9 9 9"/>
      <path d="M4 10v10h5v-5h6v5h5V10"/>
    </svg>
    Home
  </a>

  <!-- Live Interactive Classes -->
  <a href="{% url 'live_room_list' %}"
     class="ac-sidebar-item{% if request.path == '/live-classes/' %} active{% endif %}"
     title="Live Interactive Classes">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
      <circle cx="17" cy="8" r="1.5" fill="currentColor" stroke="none"/>
      <path d="M14.5 6.5C15.3 7.3 15.3 8.7 14.5 9.5"/>
      <path d="M13 5C14.7 6.7 14.7 9.3 13 11"/>
    </svg>
    Live Classes
  </a>

  <!-- CBT Practice Exams -->
  <a href="{% url 'cbt_exams' %}"
     class="ac-sidebar-item{% if request.path == '/cbt/' %} active{% endif %}"
     title="CBT Practice Exams">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M8 9h8M8 13h5"/>
      <circle cx="17" cy="14" r="2.5"/>
      <path d="M19 16l1.5 1.5"/>
    </svg>
    CBT Practice Exams
  </a>

  <!-- Discussion Room -->
  <a href="{% url 'chat_room' %}"
     class="ac-sidebar-item{% if '/chat' in request.path %} active{% endif %}"
     title="Discussion Room">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    Discussion Room
  </a>

  <!-- Profile -->
  <a href="{% url 'profile' user.username %}"
     class="ac-sidebar-item{% if request.path == '/profile/' or '/profile/' in request.path %} active{% endif %}"
     title="Profile">
    <img src="{{ user.profile.picture.url }}" alt="Profile" class="ac-sidebar-avatar">
    Profile
  </a>

  <!-- Admin (staff only) -->
  {% if user.is_staff or user.is_superuser %}
  <a href="{% url 'admin_dashboard' %}"
     class="ac-sidebar-item{% if '/dashboard' in request.path %} active{% endif %}"
     title="Admin Dashboard">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
      <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
    </svg>
    Admin
  </a>
  {% endif %}

  <div class="ac-sidebar-spacer"></div>

  <!-- Logout -->
  <a href="{% url 'logout' %}" class="ac-sidebar-item" title="Logout">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Logout
  </a>

</aside>
