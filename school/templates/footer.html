{% load static %}
{% load pwa %}
<html lang="en">  
<head>  
  <meta charset="utf-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1" />  
  {% progressive_web_app_meta %}
  <script src="{% static 'js/pwa-install.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>  
    :root {
      --ac-white: #ffffff;
      --ac-border: #dbdbdb;
      --ac-text-light: #737373;
      --ac-primary: #0095f6;
      --ac-primary-dk: #0074cc;
      --ac-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --nav-active-bg: #e8f4fd;
      --nav-bg: #ffffff;
      --nav-icon-color: #737373;
      --nav-icon-active: #0095f6;
      --badge-color: #0095f6;
    }

    body {
      font-family: var(--ac-font);
      margin: 0;
      padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    }

    /* === DOCKED STUDENT TAB BAR === */
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--nav-bg);
      border-top: 1px solid var(--ac-border);
      display: flex;
      align-items: stretch;
      z-index: 1000;
    }

    /* === TABS === */
    .nav-item {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--nav-icon-color);
      font-size: 20px;
      text-decoration: none;
      position: relative;
      transition: color 0.18s, background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item .nav-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
      color: inherit;
    }

    /* active indicator: blue bar on the top edge of the tab */
    .nav-item::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 22%; right: 22%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: transparent;
      transition: background 0.18s;
    }

    .nav-item.active {
      color: var(--nav-icon-active);
    }
    .nav-item.active::before { background: var(--nav-icon-active); }
    .nav-item.active .nav-label { font-weight: 800; }

    .nav-item:active { background: var(--nav-active-bg); }

    /* Hide bottom nav on desktop (sidebar is used instead) */
    @media (min-width: 768px) {
      .bottom-nav { display: none !important; }
      body { padding-bottom: 0; }
    }

    /* === BADGES === */
    .nav-badge-count {
      position: absolute;
      top: 8px;
      left: calc(50% + 6px);
      background: var(--badge-color);
      color: white;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      padding: 0 3px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .hidden-badge { display: none !important; }

    @media (max-width: 360px) {
      .nav-item { font-size: 18px; }
      .nav-item .nav-label { font-size: 10px; }
    }
  </style>  
</head>  
<body>  

<!-- Navigation Bar -->
<nav class="bottom-nav" id="bottomNav">
    
    <!-- 1. Home -->
    <a href="{% url 'home' %}" 
       class="nav-item {% if request.path == '/' %}active{% endif %}" 
       title="Home">
        <i class="fas fa-home"></i>
        <span class="nav-label">Home</span>
    </a>
    
    <!-- 2. Live Class -->
    <a href="{% url 'live_room_list' %}" 
       class="nav-item {% if '/live' in request.path %}active{% endif %}" 
       title="Live Class">
        <i class="fas fa-video"></i>
        <span class="nav-label">Live</span>
    </a>
    
    <!-- 3. CBT Exam -->
    <a href="{% url 'cbt_exams' %}" 
       class="nav-item {% if '/cbt' in request.path %}active{% endif %}" 
       title="CBT Exam">
        <i class="fas fa-file-alt"></i>
        <span class="nav-label">CBT</span>
    </a>
    
    <!-- 4. Discussion Room -->
    <a href="{% url 'chat_room' %}" 
       class="nav-item {% if '/chat' in request.path %}active{% endif %}" 
       title="Discussion Room">
        <i class="fas fa-comments"></i>
        <span class="nav-label">Discuss</span>
    </a>

    <!-- 5. Logout -->
    <a href="{% url 'logout' %}"
       class="nav-item"
       title="Logout"
       onclick="return confirm('Log out of TopMark?');">
        <i class="fas fa-right-from-bracket"></i>
        <span class="nav-label">Logout</span>
    </a>

</nav>  


</body>  
</html>
