{% load static %}
{% load pwa %}
{% progressive_web_app_meta %}
<script src="{% static 'js/pwa-install.js' %}" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="shortcut icon" href="{% static 'images/logo.png' %}" type="image/x-icon">
<style>
  /* ===== TopMark Design Tokens ===== */
  :root {
    --ac-bg:        #fafafa;
    --ac-white:      #ffffff;
    --ac-text:       #262626;
    --ac-text-light: #737373;
    --ac-primary:    #0095f6;
    --ac-primary-dk: #0074cc;
    --ac-primary-lt: #e8f4fd;
    --ac-border:     #dbdbdb;
    --ac-shadow:     none;
    --ac-radius:     16px;
    --ac-header-h:   64px;
    --ac-font:       'Plus Jakarta Sans', -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: var(--ac-font);
    background-color: var(--ac-bg);
    margin: 0;
    padding-bottom: 64px;
    color: var(--ac-text);
    min-height: 100vh;
  }

  /* ===== Top Header ===== */
  .ac-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--ac-header-h);
    background: var(--ac-white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
  }

  /* Header spacer — pushes every page's content below the fixed header */
  .ac-header-spacer {
    height: var(--ac-header-h);
    width: 100%;
    flex-shrink: 0;
  }

  /* Logo wordmark */
  .ac-header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }
  .ac-header-logo-img {
    width: 40px; height: 40px;
    object-fit: contain;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .ac-header-logo-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--ac-text);
    letter-spacing: -0.3px;
    line-height: 1.1;
  }
  .ac-header-logo-text .brand-top span {
    color: var(--ac-primary);
  }
  .ac-header-logo-text small {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ac-text-light);
    letter-spacing: 0;
    margin-top: 3px;
  }

  /* Icon group */
  .ac-header-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ac-header-icon-btn {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--ac-text);
    font-size: 18px;
    transition: background 0.15s, color 0.15s;
  }
  .ac-header-icon-btn:hover {
    background: var(--ac-primary-lt);
    color: var(--ac-primary);
  }
  .ac-header-icon-btn i {
    line-height: 1;
  }

  /* Notification badge */
  .ac-notif-badge {
    position: absolute;
    top: 4px; right: 4px;
    background: var(--ac-primary);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    min-width: 16px; height: 16px;
    border-radius: 100px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
    line-height: 1;
  }
  .ac-notif-badge:empty { display: none; }

  /* Profile avatar */
  .ac-header-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  /* Left group: mobile menu toggle + logo */
  .ac-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  /* Hamburger — mobile only (sidebar is always visible on desktop) */
  .ac-menu-btn {
    display: none;
    align-items: center; justify-content: center;
    width: 42px; height: 42px;
    margin-left: -8px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ac-text);
    font-size: 20px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ac-menu-btn:hover,
  .ac-menu-btn[aria-expanded="true"] {
    background: var(--ac-primary-lt);
    color: var(--ac-primary);
  }
  @media (max-width: 767px) {
    .ac-menu-btn { display: flex; }
  }
</style>

<header class="ac-header">
  <div class="ac-header-left">
    <button type="button" class="ac-menu-btn" id="ac-menu-toggle"
            aria-label="Open menu" aria-controls="ac-sidebar" aria-expanded="false">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <a href="{% url 'home' %}" class="ac-header-logo">
      <img src="{% static 'images/logo.png' %}" alt="TopMark logo" class="ac-header-logo-img">
      <span class="ac-header-logo-text"><span class="brand-top">Top<span>Mark</span></span><small>Tutorial Center</small></span>
    </a>
  </div>

  <div class="ac-header-icons">
    <a href="{% url 'notifications' %}" class="ac-header-icon-btn" title="Notifications">
      <i class="fa-regular fa-bell"></i>
      {% if unread_count %}
      <span class="ac-notif-badge">{{ unread_count }}</span>
      {% endif %}
    </a>
    <a href="{% url 'profile' user.username %}" class="ac-header-icon-btn" title="{% if user.teacher_profile %}My profile (teacher){% else %}Profile{% endif %}">
      {% if user.teacher_profile %}
      <img src="{{ user.teacher_profile.get_picture_url }}" alt="Profile" class="ac-header-avatar">
      {% else %}
      <img src="{{ user.profile.picture.url }}" alt="Profile" class="ac-header-avatar">
      {% endif %}
    </a>
  </div>
</header>

<!-- Spacer so page content always starts below the fixed header -->
<div class="ac-header-spacer"></div>
